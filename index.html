<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>D&amp;D Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23141829'/%3E%3Cpath d='M32 8l20 12v24L32 56 12 44V20z' fill='none' stroke='%23a855f7' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 8v48M12 20l40 24M52 20L12 44' stroke='%23a855f7' stroke-width='2' opacity='.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== D&D Companion – Design ===== */
:root{
  --bg:#080a12; --bg2:#0e1220; --card:rgba(22,26,42,.72); --card2:rgba(30,35,56,.78); --solid:#141829;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --txt:#eef0f8; --mut:#9ca3bd; --dim:#6b7391;
  --ac:#a855f7; --ac-rgb:168,85,247; --ac-soft:rgba(var(--ac-rgb),.16); --ac-line:rgba(var(--ac-rgb),.45);
  --good:#34d399; --bad:#fb7185; --warn:#fbbf24; --info:#60a5fa;
  --r:20px; --r2:14px; --r3:10px;
  --f-display:'Cinzel','Trajan Pro',Georgia,serif;
  --f-body:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 18px 50px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-body);color:var(--txt);background:var(--bg);min-height:100vh;min-height:100dvh;
  font-size:15px;line-height:1.5;overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(var(--ac-rgb),.20),transparent 60%),
    radial-gradient(700px 480px at 100% 8%,rgba(var(--ac-rgb),.10),transparent 60%),
    radial-gradient(800px 600px at 50% 120%,rgba(var(--ac-rgb),.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1,h2,h3,h4{margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
::selection{background:rgba(var(--ac-rgb),.4)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mut{color:var(--mut)} .dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.disp{font-family:var(--f-display);letter-spacing:.02em}
.sm{font-size:.82rem} .xs{font-size:.72rem} .center{text-align:center} .right{text-align:right}
.nowrap{white-space:nowrap} .grow{flex:1;min-width:0}
.mono{font-variant-numeric:tabular-nums}

#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 14px 130px}

/* ---------- Top bar ---------- */
.bar{position:sticky;top:0;z-index:30;margin:0 -14px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(to bottom,rgba(8,10,18,.92),rgba(8,10,18,.72));
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--line)}
.emblem{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.15rem;
  color:var(--ac);background:linear-gradient(145deg,rgba(var(--ac-rgb),.28),rgba(var(--ac-rgb),.06));
  border:1px solid var(--ac-line);box-shadow:0 0 24px -6px rgba(var(--ac-rgb),.6) inset,0 6px 18px -8px rgba(var(--ac-rgb),.8)}
.emblem.lg{width:84px;height:84px;border-radius:26px;font-size:2.2rem}
.emblem img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.who{min-width:0;flex:1;text-align:left;background:none;border:0;padding:0;display:block}
.who b{display:block;font-family:var(--f-display);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:.75rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs{display:flex;gap:6px;align-items:center}
.qchip{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:4px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);line-height:1.1}
.qchip small{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.qchip b{font-family:var(--f-display);font-size:1rem}
.qchip.hpq{min-width:64px;position:relative;overflow:hidden}
.qchip.hpq i{position:absolute;left:0;bottom:0;height:3px;background:var(--bad);transition:width .4s}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);transition:.2s}
.iconbtn:hover{border-color:var(--ac-line);background:var(--ac-soft)}
.iconbtn.pri{background:linear-gradient(145deg,var(--ac),rgba(var(--ac-rgb),.6));border-color:transparent;color:#0a0a12;box-shadow:0 8px 22px -8px rgba(var(--ac-rgb),.9)}
.iconbtn.on{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
.advchip{font-size:.7rem;font-weight:800;letter-spacing:.04em}

/* ---------- Layout ---------- */
.view{padding-top:16px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.gl{grid-template-columns:1.1fr .9fr}}
.span2{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.card>h3,.ch{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-family:var(--f-display);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--txt)}
.card>h3 i,.ch i{color:var(--ac);font-size:.95rem;width:1.2em;text-align:center}
.ch .sp{flex:1}
.ch .hint{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.75rem;color:var(--mut);font-weight:500}
.hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:26px;
  background:linear-gradient(135deg,rgba(var(--ac-rgb),.18),rgba(20,24,41,.7) 55%),var(--card);border:1px solid var(--ac-line)}
.hero h1{font-family:var(--f-display);font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.1}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.xpbar{height:7px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,rgba(var(--ac-rgb),.5),var(--ac));border-radius:9px;transition:width .5s}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);white-space:nowrap}
.chip.ac{background:var(--ac-soft);border-color:var(--ac-line);color:var(--ac)}
.chip.good{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.4);color:var(--good)}
.chip.bad{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.4);color:var(--bad)}
.chip.warn{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.4);color:var(--warn)}
.chip.info{background:rgba(96,165,250,.13);border-color:rgba(96,165,250,.4);color:var(--info)}
.chip button{background:none;border:0;padding:0;color:inherit;line-height:1}
.badge{display:inline-block;padding:1px 7px;border-radius:7px;font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--mut)}
.badge.k{background:rgba(251,191,36,.18);color:var(--warn)} .badge.r{background:rgba(96,165,250,.18);color:var(--info)}
.badge.lv{background:var(--ac-soft);color:var(--ac)}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:700;font-size:.88rem;transition:.18s;color:var(--txt)}
.btn:hover{background:rgba(255,255,255,.09);border-color:var(--ac-line)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(145deg,var(--ac),rgba(var(--ac-rgb),.65));color:#0a0a12;border-color:transparent;box-shadow:0 10px 26px -10px rgba(var(--ac-rgb),.95)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.4)}
.btn.good{color:var(--good);border-color:rgba(52,211,153,.4)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:10px}
.btn.xs{padding:3px 8px;font-size:.7rem;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.input,.sel,.ta{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--txt);transition:.15s;min-width:0}
.input:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(var(--ac-rgb),.2)}
.sel{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%239ca3bd' stroke-width='2'><path d='M1 1.5 6 6.5l5-5'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.sel option,.sel optgroup{background:#141829;color:#eef0f8}
.ta{min-height:96px;resize:vertical;line-height:1.5}
.input.num{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.input.xsm{padding:5px 8px;border-radius:9px}
.lbl{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 5px}
.field{display:block;min-width:0}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--ac);width:18px;height:18px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.12);transition:.2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ac)} .sw input:checked+i::after{transform:translateX(18px)}
.sep{height:1px;background:var(--line);margin:12px 0;border:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack>*+*{margin-top:10px}
.list>*+*{margin-top:8px}

/* ---------- HP orb ---------- */
.vital{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:480px){.vital{grid-template-columns:1fr;justify-items:center;text-align:center}}
.orb{position:relative;width:148px;height:148px;border-radius:50%;flex:none;background:#0a0d18;border:2px solid var(--line2);overflow:hidden;
  box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 40px -10px rgba(251,113,133,.5)}
.orb .liq{position:absolute;left:0;right:0;bottom:0;height:var(--p,100%);transition:height .7s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(to top,#7f1d1d,#e11d48 60%,#fb7185)}
.orb.mid .liq{background:linear-gradient(to top,#78350f,#d97706 60%,#fbbf24)}
.orb.low .liq{background:linear-gradient(to top,#450a0a,#991b1b 60%,#dc2626)}
.orb .liq::before,.orb .liq::after{content:"";position:absolute;left:-25%;width:150%;height:150%;top:-14px;border-radius:42%;background:rgba(255,255,255,.18);animation:wave 7s linear infinite}
.orb .liq::after{top:-10px;background:rgba(255,255,255,.1);animation-duration:11s;animation-direction:reverse}
@keyframes wave{to{transform:rotate(360deg)}}
.orb .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.9);z-index:2}
.orb .num b{font-family:var(--f-display);font-size:2.2rem;line-height:1}
.orb .num small{font-size:.8rem;color:#fff;opacity:.85}
.orb .tmp{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:800;padding:1px 8px;border-radius:99px;background:rgba(96,165,250,.9);color:#06101e;z-index:3}
.hpctl{display:grid;gap:10px;width:100%}
.hpctl .amt{display:flex;gap:8px}
.hpctl .amt .input{max-width:110px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;position:relative}
.stat small{display:block;font-size:.63rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.15}
.stat em{display:block;font-style:normal;font-size:.68rem;color:var(--dim)}
.stat.click{cursor:pointer;transition:.15s} .stat.click:hover{border-color:var(--ac-line);background:var(--ac-soft)}
.stat.ov::after{content:"✎";position:absolute;top:4px;right:6px;font-size:.6rem;color:var(--ac)}
.shield{clip-path:polygon(50% 0,100% 12%,100% 62%,50% 100%,0 62%,0 12%)}

/* ---------- Ability tiles ---------- */
.abgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:680px){.abgrid{grid-template-columns:repeat(6,1fr)}}
.ab{position:relative;text-align:center;padding:12px 6px 26px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);transition:.18s;cursor:pointer;color:var(--txt);width:100%}
.ab:hover{border-color:var(--ac-line);transform:translateY(-2px);box-shadow:0 12px 24px -14px rgba(var(--ac-rgb),.9)}
.ab small{display:block;font-size:.63rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ab b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.1;margin-top:2px}
.ab .sc{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);min-width:42px;padding:2px 8px;border-radius:99px;background:var(--solid);border:1px solid var(--line2);font-size:.8rem;font-weight:800}
.ab.pri{border-color:var(--ac-line);background:linear-gradient(160deg,rgba(var(--ac-rgb),.22),rgba(255,255,255,.02))}
.ab .pm{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.saves{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.save{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:13px;background:rgba(0,0,0,.22);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:.15s}
.save:hover{border-color:var(--ac-line)}
.save b{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Pips ---------- */
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--line2);display:inline-block;flex:none;position:relative;background:transparent;padding:0;transition:.15s}
.pip.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 10px rgba(var(--ac-rgb),.7)}
.pip.ex{background:var(--ac);border-color:var(--ac);box-shadow:0 0 10px rgba(var(--ac-rgb),.7)}
.pip.ex::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac)}
.pip.half{background:linear-gradient(90deg,var(--ac) 50%,transparent 50%);border-color:var(--ac)}
.pips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pb{width:24px;height:24px;border-radius:8px;border:2px solid var(--ac-line);background:transparent;padding:0;transition:.15s}
.pb.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 12px rgba(var(--ac-rgb),.6)}
.pb.used{background:rgba(255,255,255,.04);border-color:var(--line2);opacity:.6}
.gem{width:26px;height:26px;transform:rotate(45deg);border-radius:6px;border:2px solid var(--ac-line);background:transparent;padding:0;transition:.15s;margin:3px}
.gem.on{background:linear-gradient(145deg,#fff3,var(--ac));border-color:var(--ac);box-shadow:0 0 14px rgba(var(--ac-rgb),.7)}
.gem.used{background:rgba(255,255,255,.04);border-color:var(--line2);opacity:.55}

/* ---------- Skills ---------- */
.skills{display:grid;gap:6px;grid-template-columns:1fr}
@media(min-width:760px){.skills{grid-template-columns:1fr 1fr}}
.sk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;background:rgba(0,0,0,.2);border:1px solid var(--line);cursor:pointer;transition:.15s;width:100%;text-align:left;color:var(--txt)}
.sk:hover{border-color:var(--ac-line);background:var(--ac-soft)}
.sk .nm{flex:1;min-width:0;font-weight:600}
.sk .nm small{display:block;font-weight:500;font-size:.68rem;color:var(--dim)}
.sk b{font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-size:1rem}
.sk .ab3{font-size:.62rem;font-weight:800;letter-spacing:.08em;color:var(--mut);background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
.sk .pipwrap{width:26px;display:grid;place-items:center}
.passives{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- Weapons / items ---------- */
.item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block}
.item .tt small{color:var(--mut);display:block;font-size:.75rem}
.item .acts{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.atk{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:11px;background:var(--ac-soft);border:1px solid var(--ac-line);color:var(--ac);font-weight:800;min-width:54px}
.atk small{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.atk:hover{filter:brightness(1.2)}
.dmg{font-weight:800;color:var(--txt)}
.empty{padding:22px 14px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:14px;font-size:.88rem}
.enc{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.enc i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));background-size:300% 100%;border-radius:9px}
.coin{text-align:center;padding:8px 4px;border-radius:13px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.coin small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.08em}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.coin.pp small{color:#c4b5fd}.coin.gp small{color:#fbbf24}.coin.ep small{color:#7dd3fc}.coin.sp small{color:#d1d5db}.coin.cp small{color:#fb923c}

/* ---------- Spells ---------- */
.slotrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.slotrow:last-child{border-bottom:0}
.slotrow .lv{width:74px;font-weight:700;font-size:.85rem;flex:none}

function rnd(n) {
  try { if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); const lim = Math.floor(4294967296 / n) * n; let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return (x % n) + 1; } } catch (e) { }
  return 1 + Math.floor(Math.random() * n);
}
function parseExpr(s) {
  const e = String(s || '').toLowerCase().replace(/w/g, 'd').replace(/[\s×x]/g, '').replace(/−/g, '-');
  if (!e) return null;
  const re = /([+-]?)(?:(\d*)d(\d+)|(\d+))/g; const terms = []; let m, end = 0;
  while ((m = re.exec(e))) {
    if (m.index !== end) return null; end = re.lastIndex;
    const s2 = m[1] === '-' ? -1 : 1;
    if (m[3]) terms.push({ s: s2, n: m[2] === '' ? 1 : +m[2], d: +m[3] }); else terms.push({ s: s2, v: +m[4] });
  }
  if (end !== e.length || !terms.length) return null;
  if (terms.some(t => (t.d && (t.n > 100 || t.d > 1000)))) return null;
  return terms;
}
function rollExpr(expr, o = {}) {
  const terms = parseExpr(expr); if (!terms) return null;
  let total = 0; const parts = [];
  terms.forEach(t => {
    if (t.d) { const n = o.crit ? t.n * 2 : t.n; const rolls = Array.from({ length: n }, () => rnd(t.d)); const sum = rolls.reduce((a, b) => a + b, 0); total += t.s * sum; parts.push({ s: t.s, n, d: t.d, rolls, sum }); }
    else { total += t.s * t.v; parts.push({ s: t.s, v: t.v }); }
  });
  return { total: Math.max(0, total), raw: total, parts };
}

  const a = rnd(20), b = mode ? rnd(20) : null; let kept = a;
  if (mode === 1) kept = Math.max(a, b); else if (mode === -1) kept = Math.min(a, b);
  let eff = kept; if (o.min && eff < o.min) eff = o.min;
  return { a, b, kept, eff, bonus, total: eff + bonus, mode, crit: kept === 20, fumble: kept === 1 };
}
function fmtParts(parts) {

}

function resMax(r, L, D) {

function calc(c) {

/* ---------- Toast ---------- */
function toast(o) {
  const el = document.createElement('div'); el.className = 'toast ' + (o.cls || '');
  el.innerHTML = `<div class="th">${o.icon ? ico(o.icon) : ''}<span>${o.title}</span></div>` +
    (o.lines || []).map(l => `<div class="tl"><div class="big ${l.cls || ''}">${l.total}</div><div class="dt">${l.html || ''}</div></div>`).join('') +
    (o.note ? `<div class="note">${o.note}</div>` : '');
  const box = $('#toasts'); box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  const out = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.addEventListener('click', out); setTimeout(out, o.ms || 7500);
  return el;
}
const HIST = [];
function hist(label, total) { HIST.unshift({ label, total, t: new Date() }); if (HIST.length > 30) HIST.pop(); }
function modeFor(kind, ev) {
  let m = ui.adv; if (ev && ev.shiftKey) m = 1; if (ev && ev.altKey) m = -1;
  const a = D ? autoMode(D, kind) : 0; ui.adv = 0; const b = $('#advbtn'); if (b) b.outerHTML = advBtn();
  return { mode: clamp(m + a, -1, 1), auto: a, manual: m };
}
function d20Html(r, bonus) {
  const dice = r.b == null ? `<span class="dieicon ${r.a === 20 ? 'max' : r.a === 1 ? 'min' : ''}">${r.a}</span>`
    : [r.a, r.b].map((v, i) => { const keep = v === r.kept && (i === 0 || r.a !== r.b || true); return `<span class="dieicon ${v === r.kept ? '' : 'drop'} ${v === 20 ? 'max' : v === 1 ? 'min' : ''}">${v}</span>`; }).join('');
  return `<b>W20</b> ${dice} ${bonus ? `<b>${sgn(bonus)}</b>` : ''}${r.eff !== r.kept ? ` <span class="warn">(min. ${r.eff})</span>` : ''}${r.mode === 1 ? ' <span class="good">Vorteil</span>' : r.mode === -1 ? ' <span class="bad">Nachteil</span>' : ''}`;
}
function rollCheck(label, bonus, kind = 'check', o = {}) {
  const { mode, auto } = modeFor(kind, o.ev); const r = rollD20(bonus, mode, { min: o.min });
  const note = (auto < 0 ? condNote(D, kind) : '') + (o.note ? ' ' + o.note : '');
  hist(label, r.total);
  toast({ title: esc(label), icon: o.icon || 'fa-dice-d20', cls: r.crit ? 'crit' : r.fumble ? 'fumble' : '', lines: [{ total: r.total, cls: r.crit ? 'crit' : r.fumble ? 'fumble' : '', html: d20Html(r, bonus) + (r.crit ? '<br><b class="good">Kritischer Erfolg!</b>' : r.fumble ? '<br><b class="bad">Patzer!</b>' : '') }], note });
  return r;
}
function dmgLine(label, expr, crit, extra = '') {
  const r = rollExpr(expr, { crit }); if (!r) return null;
  return { total: r.total, html: `<b>${esc(label)}</b>${crit ? ' <span class="good">(Krit: doppelte Würfel)</span>' : ''}<br>${fmtParts(r.parts)} ${extra}`, r };
}
function rollAttack(label, atk, dmg, dmgType, ev, opt = {}) {
  const { mode, auto } = modeFor('attack', ev); const r = rollD20(atk, mode, {});
  const lines = [{ total: r.total, cls: r.crit ? 'crit' : r.fumble ? 'fumble' : '', html: '<b>Treffer</b> ' + d20Html(r, atk) + (r.crit ? ' <b class="good">KRITISCH!</b>' : r.fumble ? ' <b class="bad">Patzer</b>' : '') }];
  hist(label + ' (Angriff)', r.total);
  if (dmg && !r.fumble) { const d = dmgLine('Schaden' + (dmgType ? ' (' + dmgType + ')' : ''), dmg, r.crit); if (d) { lines.push(d); hist(label + ' (Schaden)', d.total); } }
  toast({ title: esc(label), icon: opt.icon || 'fa-khanda', cls: r.crit ? 'crit' : r.fumble ? 'fumble' : '', lines, note: auto < 0 ? condNote(D, 'attack') : '' });
  return r;
}
function rollDamage(label, expr, o = {}) {
  const d = dmgLine(label, expr, !!o.crit); if (!d) { toast({ title: esc(label), lines: [{ total: '?', html: 'Ungültiger Ausdruck' }] }); return null; }

/* ---------- HP ---------- */
function setHp(v) { const c = D.c; c.hp = clamp(int(v), 0, D.hpMax); }
function applyDamage(n) {
  const c = D.c; n = Math.max(0, int(n)); if (!n) return;
  let rest = n; const wasZero = D.hp === 0;
  if (D.temp) { const t = Math.min(D.temp, rest); c.temp = D.temp - t; rest -= t; }
  const newHp = Math.max(0, D.hp - rest); const msg = [];
  if (wasZero && rest > 0) { c.ds.f = Math.min(3, c.ds.f + 1); msg.push('Schaden bei 0 TP: 1 Todesrettungswurf-Fehlschlag.'); }
  else if (newHp === 0 && D.hp > 0) { msg.push(rest - D.hp >= D.hpMax ? '<b class="bad">Sofortiger Tod (Schaden ≥ TP-Maximum)!</b>' : 'Der Charakter geht zu Boden (0 TP).'); if (c.conc) { msg.push('Konzentration auf ' + esc(c.conc) + ' endet.'); c.conc = ''; } c.ds = { s: 0, f: 0 }; }
  else if (c.conc && rest > 0) msg.push(`Konzentrationsprobe: KON-RW gegen SG ${Math.max(10, Math.floor(rest / 2))}.`);
  c.hp = newHp;
  toast({ title: 'Schaden', icon: 'fa-burst', cls: 'fumble', lines: [{ total: '−' + n, cls: 'fumble', html: `TP: <b>${newHp}</b> / ${D.hpMax}${D.temp && c.temp !== D.temp ? ' (temp. TP absorbiert)' : ''}` }], note: msg.join('<br>'), ms: 5000 });
  touch();
}
function applyHeal(n) {
  const c = D.c; n = Math.max(0, int(n)); if (!n) return; const was = D.hp;
  c.hp = Math.min(D.hpMax, D.hp + n); if (was === 0) { c.ds = { s: 0, f: 0 }; c.conds = c.conds.filter(x => x !== 'Bewusstlos'); }
  toast({ title: 'Heilung', icon: 'fa-heart', cls: 'crit', lines: [{ total: '+' + (c.hp - was), cls: 'crit', html: `TP: <b>${c.hp}</b> / ${D.hpMax}` }], ms: 4000 }); touch();
}
const amt = () => Math.max(0, int($('#hp-amt') ? $('#hp-amt').value : ui.amt));
INP.amt = t => { ui.amt = t.value; };
ACT.hpq = t => { const v = int(t.dataset.v); if (v < 0) applyDamage(1); else applyHeal(1); };
ACT.hpDmg = () => { const n = amt(); if (!n) return toast({ title: 'Bitte eine Menge eingeben', icon: 'fa-circle-info', ms: 2500 }); ui.amt = ''; applyDamage(n); };
ACT.hpHeal = () => { const n = amt(); if (!n) return toast({ title: 'Bitte eine Menge eingeben', icon: 'fa-circle-info', ms: 2500 }); ui.amt = ''; applyHeal(n); };
ACT.hpTemp = () => { const n = amt(); if (!n) return toast({ title: 'Bitte eine Menge eingeben', icon: 'fa-circle-info', ms: 2500 }); ui.amt = ''; D.c.temp = Math.max(D.temp, n); touch(); };

ACT.dsTog = t => { const c = D.c; const k = t.dataset.v, i = +t.dataset.i; c.ds[k] = c.ds[k] === i + 1 ? i : i + 1; touch(); };
ACT.deathRoll = () => {
  const c = D.c; const r = rollD20(0, 0); let msg = '';
  if (r.kept === 20) { c.hp = 1; c.ds = { s: 0, f: 0 }; msg = 'Natürliche 20: der Charakter kommt mit 1 TP wieder zu sich!'; }
  else if (r.kept === 1) { c.ds.f = Math.min(3, c.ds.f + 2); msg = 'Natürliche 1: zwei Fehlschläge.'; }

function casterCard(q) {

  const lvls = {}; names.forEach(n => { const s = findSpell(n); if (s) (lvls[s.l] = lvls[s.l] || []).push(s); });
  const alw = q.always.map(findSpell).filter(Boolean);
  const prepCount = book ? (sp.prep || []).filter(n => !q.always.includes(n)).length : names.length;
  const limit = book ? q.prepMax : (q.mode === 'prep' ? q.prepMax : q.knownMax);
  const limLbl = book ? 'Vorbereitet' : (q.mode === 'prep' ? 'Vorbereitet' : 'Bekannt');
  const over = limit != null && prepCount > limit;
  const head = `<div class="dcs" style="margin-bottom:12px">${chip('Zauber-SG <b>' + q.dc + '</b>', 'ac')}${chip('Zauberangriff <b>' + sgn(q.atk) + '</b>', 'ac')}${chip(AB_BY[q.ab].s + ' ' + sgn(q.mod))}${q.cantMax ? chip('Zaubertricks ' + (sp.cant || []).length + '/' + q.cantMax, (sp.cant || []).length > q.cantMax ? 'warn' : '') : ''}${limit != null ? chip(limLbl + ' ' + prepCount + '/' + limit, over ? 'warn' : '') : ''}${book ? chip('Zauberbuch ' + names.length + '/' + q.bookMax) : ''}${q.focus ? chip(ico('fa-wand-magic') + ' ' + esc(q.focus)) : ''}</div>`;
  let body = head;
  if (alw.length) body += `<div class="lvhead">Immer vorbereitet</div><div class="list">${alw.map(s => spellRow(s, q, { always: true })).join('')}</div>`;
  if (q.cantMax || cants.length) body += `<div class="lvhead">Zaubertricks (Cantrips)</div><div class="list">${cants.length ? cants.map(s => spellRow(s, q, { remove: 'cant' })).join('') : empty('Noch keine Zaubertricks gewählt.')}</div>`;
  Object.keys(lvls).sort((a, b) => a - b).forEach(l => {
    body += `<div class="lvhead">Grad ${l}</div><div class="list">${lvls[l].map(s => spellRow(s, q, { remove: 'list', book, prepared: book && (sp.prep || []).includes(s.n) })).join('')}</div>`;

}

function coinsGp(c) { const k = c.coins; return k.pp * 10 + k.gp + k.ep * 0.5 + k.sp * 0.1 + k.cp * 0.01; }
function carried(c) {
  const k = c.coins; const coinsKg = (k.pp + k.gp + k.ep + k.sp + k.cp) * 0.01;
  const arm = c.armor && ARMOR_BY[c.armor] ? ARMOR_BY[c.armor][8] : 0;
  return c.inv.reduce((a, i) => a + num(i.w) * Math.max(0, int(i.q, 1)), 0) + arm + (c.shield ? 3 : 0) + weaponKg(c) + coinsKg;
}
VIEWS.inventory = function () {

  return `<div class="grid g2">
  ${card('Münzen', 'fa-coins', `<div class="coins">${coin('pp', 'PM')}${coin('gp', 'GM')}${coin('ep', 'EM')}${coin('sp', 'SM')}${coin('cp', 'KM')}</div><p class="sm mut" style="margin:10px 0 0">Gesamtwert ≈ <b>${(Math.round(coinsGp(c) * 100) / 100).toString().replace('.', ',')} GM</b></p>`)}
  ${card('Traglast', 'fa-weight-hanging', `<div class="row sb sm"><span><b>${fmtKg(w)}</b> kg getragen</span><span class="mut">Tragkraft ${fmtKg(cap)} kg · Heben ${fmtKg(cap * 2)} kg</span></div><div class="enc" style="margin-top:8px"><i style="width:${pct}%;background-size:${Math.max(100, 10000 / Math.max(pct, 1))}% 100%"></i></div><p class="xs mut" style="margin:8px 0 0">Enthält Inventar, Rüstung, Schild, Waffen und Münzen (50 Münzen = 0,5 kg). Schwerere Lasten: Variante „Belastung“ im SL-Handbuch.</p>`)}
  <div class="span2">${card('Ausrüstung & Gegenstände', 'fa-bag-shopping', `<div class="list">${items}</div><div class="btns" style="margin-top:12px"><button class="btn pri sm" data-a="invAdd">${ico('fa-plus')} Aus Liste</button><button class="btn sm" data-a="invCustom">${ico('fa-pen')} Eigener Gegenstand</button></div>`)}</div></div>`;
};

const MS = [];
function openModal(def) {
  const m = Object.assign({ id: uid(), st: {} }, def); MS.push(m);
  const wrap = document.createElement('div'); wrap.className = 'ovl'; wrap.dataset.mid = m.id;
  wrap.innerHTML = `<div class="sheet ${m.size || ''}" role="dialog" aria-modal="true" aria-label="${esc(m.label || '')}" tabindex="-1"><header><h2>${m.title || ''}</h2><button class="iconbtn" data-a="mClose" aria-label="Schließen">${ico('fa-xmark')}</button></header><div class="mb"></div><footer></footer></div>`;
  $('#modals').appendChild(wrap); m.el = wrap;
  wrap.addEventListener('mousedown', e => { if (e.target === wrap && !m.sticky) closeModal(m); });
  fillModal(m); const sh = $('.sheet', wrap); if (sh) sh.focus({ preventScroll: true });
  return m;
}
function fillModal(m) {
  if (!m.el) return; const mb = $('.mb', m.el); const top = mb.scrollTop;
  mb.innerHTML = typeof m.body === 'function' ? m.body(m) : m.body;
  const f = $('footer', m.el); const fh = m.foot ? (typeof m.foot === 'function' ? m.foot(m) : m.foot) : ''; f.innerHTML = fh; f.classList.toggle('hide', !fh);
  if (m.title && m.titleFn) $('header h2', m.el).innerHTML = m.titleFn(m);
  mb.scrollTop = top; if (m.after) m.after(m);
}
function closeModal(m) { m = m || MS[MS.length - 1]; if (!m) return; if (m.el) m.el.remove(); const i = MS.indexOf(m); if (i >= 0) MS.splice(i, 1); if (m.onClose) m.onClose(m); }
function refreshModals() { MS.slice().forEach(m => { if (!m.manual) fillModal(m); }); }
const modalOf = el => { const o = el.closest('.ovl'); return o ? MS.find(m => m.id === o.dataset.mid) : null; };
ACT.mClose = t => closeModal(modalOf(t));
function askConfirm(title, text, yes, label = 'Ja, weiter', danger = false) {
  openModal({ title: esc(title), size: 'narrow', body: `<p style="margin:0">${esc(text)}</p>`, foot: `<button class="btn" data-a="mClose">Abbrechen</button><button class="btn ${danger ? 'danger' : 'pri'}" data-a="mYes">${esc(label)}</button>`, st: { yes } });
}
ACT.mYes = t => { const m = modalOf(t); closeModal(m); if (m && m.st.yes) m.st.yes(); };

/* ---------- Würfeln ---------- */

  <p class="xs mut" style="margin:12px 0 0">Tipp: Beim Würfeln auf Angriffe/Proben ⇧ Umschalt = Vorteil, Alt = Nachteil. Zustände (z. B. Vergiftet) wirken automatisch.</p>`;

ACT.rollDie = t => {
  const v = t.dataset.v;
  if (v === '20') { rollCheck('W20', 0, 'plain'); } else { const expr = /d/.test(v) ? v : '1d' + v; const r = rollExpr(expr); hist(expr, r.total); toast({ title: expr.replace(/d/, 'W'), icon: 'fa-dice', lines: [{ total: r.total, cls: '', html: fmtParts(r.parts) }], ms: 5000 }); }
  MS.forEach(m => { if (m.body === diceBody) fillModal(m); });
};
ACT.rollExpr = () => {
  const s = val('dx').trim(); if (!s) return; const t = parseExpr(s);
  if (!t) return toast({ title: 'Ungültiger Ausdruck', icon: 'fa-circle-exclamation', lines: [{ total: '?', html: 'Format: <b>2W6+3</b>, <b>1d20+5</b> oder <b>4d8</b>' }], ms: 3500 });
  if (t.length <= 2 && t[0].d === 20 && t[0].n === 1 && (t.length === 1 || t[1].v != null)) { const b = t.length === 2 ? t[1].s * t[1].v : 0; rollCheck(s.toUpperCase(), b, 'plain'); }
  else { const r = rollExpr(s); hist(s, r.total); toast({ title: esc(s.toUpperCase()), icon: 'fa-dice', lines: [{ total: r.total, html: fmtParts(r.parts) }], ms: 6000 }); }
  MS.forEach(m => { if (m.body === diceBody) fillModal(m); });
};

function luBody(m) {
  const c = D.c; const st = m.st; const cl = st.k ? c.classes.find(x => x.k === st.k) : null;
  const newLvl = cl ? cl.lvl + 1 : 1; const def = CLASSES[st.k || 'fighter'];
  const opts = c.classes.map(x => `<button class="pick ${st.k === x.k ? 'sel' : ''}" data-a="luSel" data-k="${x.k}"><span style="color:var(--ac);width:24px;text-align:center">${ico(ICON[x.k])}</span><span class="tt"><b>${esc(CLASSES[x.k].n)} ${x.lvl} → ${x.lvl + 1}</b><small>${x.lvl >= 20 ? 'Höchststufe' : ''}</small></span></button>`).join('');
  const newOpts = CLASS_ORDER.filter(k => !c.classes.some(x => x.k === k)).map(k => `<option value="${k}" ${st.k === k && !cl ? 'selected' : ''}>${esc(CLASSES[k].n)}</option>`).join('');
  let preview = '';
  if (st.k) {
    const feats = def.f.filter(f => f[0] === newLvl);
    const sub = cl ? subOf(st.k, cl.sub) : null; const sfe = sub ? sub.f.filter(f => f[0] === newLvl) : [];
    const needSub = newLvl >= def.subAt && (!cl || !cl.sub) && (SUBS[st.k] || []).length;
    const asi = (def.asi || []).includes(newLvl);
    const avg = def.hd / 2 + 1;
    preview = `<hr class="sep"><h4>Das bekommst du auf ${esc(def.n)} ${newLvl}</h4>
    <ul style="margin:0 0 8px;padding-left:18px" class="sm">${feats.concat(sfe).map(f => `<li><b>${esc(f[1])}</b> – ${esc(f[2])}</li>`).join('') || '<li class="dim">Keine neuen Klassenmerkmale (Verbesserungen siehe unten).</li>'}</ul>
    ${asi ? `<p class="sm good" style="margin:0 0 8px">${ico('fa-medal')} Attributswerterhöhung oder Talent – im Reiter „Merkmale“ wählen.</p>` : ''}
    ${needSub ? `<label class="field"><span class="lbl">${esc(def.subName)} wählen</span><select class="sel" data-c="luSub"><option value="">– später –</option>${SUBS[st.k].map(s => `<option value="${esc(s.n)}" ${st.sub === s.n ? 'selected' : ''}>${esc(s.n)} (${esc(s.src || '')})</option>`).join('')}</select></label>` : ''}
    <h4>Trefferpunkte</h4><div class="seg"><button class="${st.hp !== 'roll' ? 'on' : ''}" data-a="luHp" data-v="avg">Durchschnitt (${avg})</button><button class="${st.hp === 'roll' ? 'on' : ''}" data-a="luHp" data-v="roll">Würfeln (W${def.hd})</button></div>
    ${st.hp === 'roll' ? `<span class="chip" style="margin-left:10px">${st.roll ? 'Gewürfelt: ' + st.roll : 'wird beim Bestätigen gewürfelt'}</span>` : ''}
    <p class="xs mut" style="margin:8px 0 0">Plus KON-Modifikator ${sgn(D.mod.con)} pro Stufe.</p>`;
  }
  return `<h4>Welche Klasse steigt auf?</h4><div class="list">${opts}</div>${newOpts ? `<label class="field" style="margin-top:10px"><span class="lbl">… oder neue Klasse (Mehrfachklasse)</span><select class="sel" data-c="luNew"><option value="">– neue Klasse –</option>${newOpts}</select></label>` : ''}${preview}`;
}

ACT.luDo = t => {
  const m = modalOf(t); const st = m.st; const c = D.c; const before = D.hpMax; const beforeHp = D.hp;
  let cl = c.classes.find(x => x.k === st.k);
  if (cl) { if (cl.lvl >= 20) return toast({ title: 'Diese Klasse hat bereits Stufe 20', icon: 'fa-circle-info', ms: 3000 }); cl.lvl++; }
  else { cl = { k: st.k, sub: '', lvl: 1 }; c.classes.push(cl); }
  if (st.sub) cl.sub = st.sub;
  if (st.hp === 'roll' && c.classes.indexOf(cl) >= 0 && !(c.classes.length === 1 && cl.lvl === 1)) c.hpRoll[cl.k + cl.lvl] = rnd(CLASSES[cl.k].hd);
  const D2 = calc(c); c.hp = clamp(beforeHp + (D2.hpMax - before), 0, D2.hpMax);
  closeModal(m); touch();
  toast({ title: 'Stufenaufstieg!', icon: 'fa-arrow-up', cls: 'crit', lines: [{ total: D2.L, cls: 'crit', html: `<b>${esc(CLASSES[cl.k].n)} ${cl.lvl}</b><br>TP-Maximum: ${before} → ${D2.hpMax}` }], ms: 6000 });
};

/* ---------- Rasten ---------- */
function applyShortRest() {
  const c = D.c; D.res.forEach(r => { if (r.r === 'k' || (r.rk && classLvlOfRes(r) >= r.rk)) delete c.used[r.key]; });
  c.pactUsed = 0; if (c.rage) c.rage = false;
}
function srBody() {
  const c = D.c;
  const rows = D.cls.map(x => { const left = x.lvl - int(c.hdUsed[x.k]); return `<div class="res"><div class="tt"><b>${esc(x.def.n)} – W${x.def.hd}</b><small>${left} von ${x.lvl} Trefferwürfeln übrig (+${D.mod.con} KON)</small></div><button class="btn sm pri" data-a="hdRoll" data-k="${x.k}" ${left <= 0 ? 'disabled' : ''}>${ico('fa-dice')} Würfeln</button></div>`; }).join('');
  return `<p class="sm mut" style="margin-top:0">Aktuell: <b>${D.hp} / ${D.hpMax}</b> TP. Du kannst nach Belieben Trefferwürfel ausgeben.</p><div class="list">${rows}</div>
  <p class="xs mut" style="margin:12px 0 0">Beim Beenden: Ressourcen mit „Kurze Rast“ erneuern sich${D.pact ? ', Paktmagie-Plätze kehren zurück' : ''}.${D.has('wizard') ? ' Arkane Erholung kannst du jetzt einsetzen.' : ''}${D.has('bard', 2) ? ' Lied der Rast: bonus-TP für Verbündete.' : ''}</p>`;
}
ACT.shortRest = () => { closeAll(); openModal({ title: ico('fa-mug-hot') + ' Kurze Rast', size: 'narrow', body: srBody, foot: '<button class="btn" data-a="mClose">Abbrechen</button><button class="btn pri" data-a="srDone">Rast beenden</button>' }); };
ACT.hdRoll = t => {
  const c = D.c; const k = t.dataset.k; const x = D.cls.find(y => y.k === k); if (x.lvl - int(c.hdUsed[k]) <= 0) return;
  const r = rnd(x.def.hd); const heal = Math.max(0, r + D.mod.con); c.hdUsed[k] = int(c.hdUsed[k]) + 1;
  const was = D.hp; c.hp = Math.min(D.hpMax, D.hp + heal); if (was === 0 && c.hp > 0) { c.ds = { s: 0, f: 0 }; }
  toast({ title: 'Trefferwürfel W' + x.def.hd, icon: 'fa-heart', cls: 'crit', lines: [{ total: '+' + (c.hp - was), cls: 'crit', html: `<span class="dieicon">${r}</span> ${sgn(D.mod.con)} · TP <b>${c.hp}</b> / ${D.hpMax}` }], ms: 4000 }); touch();
};
ACT.srDone = t => { applyShortRest(); closeModal(modalOf(t)); touch(); toast({ title: 'Kurze Rast beendet', icon: 'fa-mug-hot', lines: [{ total: '✓', html: 'Ressourcen der kurzen Rast erneuert.' }], ms: 4000 }); };
ACT.longRest = () => {
  closeAll();
  openModal({ title: ico('fa-bed') + ' Lange Rast', size: 'narrow', body: `<p style="margin-top:0">Eine lange Rast (8 Std.) stellt wieder her:</p><ul class="sm" style="padding-left:18px"><li>alle Trefferpunkte (${D.hpMax}) und temporäre TP verfallen</li><li>die Hälfte deiner Trefferwürfel (mind. 1)</li><li>alle Zauberplätze und alle Klassenressourcen</li><li>1 Stufe Erschöpfung wird abgebaut</li><li>Todesrettungswürfe und Konzentration werden zurückgesetzt</li></ul>`, foot: '<button class="btn" data-a="mClose">Abbrechen</button><button class="btn pri" data-a="lrDo">Lange Rast</button>' });
};
ACT.lrDo = t => {
  const c = D.c; c.hp = null; c.temp = 0; c.used = {}; c.slotsUsed = [0, 0, 0, 0, 0, 0, 0, 0, 0]; c.xslots = [0, 0, 0, 0, 0, 0, 0, 0, 0]; c.pactUsed = 0; c.ds = { s: 0, f: 0 }; c.conc = ''; c.rage = false;
  let regain = Math.max(1, Math.floor(D.L / 2));
  D.cls.forEach(x => { const u = int(c.hdUsed[x.k]); const g = Math.min(u, regain); c.hdUsed[x.k] = u - g; regain -= g; });
  c.exh = Math.max(0, c.exh - 1); c.conds = c.conds.filter(n => n !== 'Bewusstlos'); closeModal(modalOf(t)); touch();
  toast({ title: 'Lange Rast beendet', icon: 'fa-bed', cls: 'crit', lines: [{ total: '✓', cls: 'crit', html: 'TP, Zauberplätze und Ressourcen sind wieder voll.' }], ms: 4500 });
};

ACT.exportChar = () => {
  closeAll(); const json = JSON.stringify({ app: 'dnd-companion', v: 2, chars: [D.c] }, null, 1);
  openModal({ title: ico('fa-file-export') + ' Exportieren', body: `<div class="btns" style="margin-bottom:12px"><button class="btn pri" data-a="dlJson" data-all="0">${ico('fa-download')} „${esc(D.c.name)}“ herunterladen</button><button class="btn" data-a="dlJson" data-all="1">${ico('fa-download')} Alle Helden</button><button class="btn" data-a="copyJson">${ico('fa-copy')} Kopieren</button></div><textarea id="exp-ta" class="ta" style="min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem" readonly>${esc(json)}</textarea>`, manual: true });
};
function download(name, text) {
  try { const b = new Blob([text], { type: 'application/json' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 500); }
  catch (e) { toast({ title: 'Download nicht möglich – bitte „Kopieren“ nutzen', icon: 'fa-circle-exclamation' }); }
}
ACT.dlJson = t => { const all = t.dataset.all === '1'; const j = JSON.stringify({ app: 'dnd-companion', v: 2, chars: all ? S.chars : [D.c] }, null, 1); download((all ? 'dnd-helden' : D.c.name.replace(/[^\w\-äöüÄÖÜß]+/g, '_')) + '.json', j); };
ACT.copyJson = () => { const ta = $('#exp-ta'); ta.select(); try { (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast({ title: 'In die Zwischenablage kopiert', icon: 'fa-copy', ms: 2500 }), () => { document.execCommand('copy'); toast({ title: 'Kopiert', icon: 'fa-copy', ms: 2500 }); }); } catch (e) { document.execCommand && document.execCommand('copy'); } };
ACT.importChar = () => {
  closeAll(); openModal({ title: ico('fa-file-import') + ' Importieren', body: `<p class="sm mut" style="margin-top:0">Lade eine exportierte JSON-Datei oder füge den Text ein. Auch Daten der alten Companion-App werden erkannt.</p><input type="file" id="imp-file" accept=".json,application/json" class="input" data-c="impFile"><textarea id="imp-ta" class="ta" style="margin-top:10px;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem" placeholder="JSON hier einfügen …"></textarea>`, foot: '<button class="btn" data-a="mClose">Abbrechen</button><button class="btn pri" data-a="impDo">Importieren</button>', manual: true });
};
CHG.impFile = t => { const f = t.files && t.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#imp-ta').value = rd.result; }; rd.readAsText(f); };
ACT.impDo = t => {
  try {
    const data = JSON.parse(val('imp-ta')); const added = importData(data);
    if (!added) throw new Error('empty');
    closeAll(); persist(); render(); toast({ title: 'Import erfolgreich', icon: 'fa-file-import', cls: 'crit', lines: [{ total: added, cls: 'crit', html: added === 1 ? 'Held importiert.' : 'Helden importiert.' }], ms: 4000 });
  } catch (e) { toast({ title: 'Import fehlgeschlagen', icon: 'fa-circle-exclamation', cls: 'fumble', lines: [{ total: '!', cls: 'fumble', html: 'Die Daten konnten nicht gelesen werden.' }] }); }
};
function importData(data) {
  let list = [];
  if (Array.isArray(data)) list = data; else if (data && Array.isArray(data.chars)) list = data.chars; else if (data && data.classes) list = [data]; else if (data && data.className) list = [data];
  let n = 0;
  list.forEach(raw => {
    let c = raw;
    if (raw.className && !raw.classes) c = migrateLegacy(raw);
    else { c = normalize(JSON.parse(JSON.stringify(raw))); }
    if (S.chars.some(x => x.id === c.id)) c.id = uid();
    S.chars.push(c); S.cur = c.id; n++;
  });
  return n;
}

/* ---------- Zauberauswahl ---------- */
function maxSpellLvl(q) {
  if (!q) return 9; if (q.type === 'pact') { const L = q.lvl; return Math.max(D.pact ? D.pact[1] : 1, L >= 17 ? 9 : L >= 15 ? 8 : L >= 13 ? 7 : L >= 11 ? 6 : 0); }
  let m = 0; D.slotMax.forEach((n, i) => { if (n) m = i + 1; }); return Math.max(1, m);
}
function spBody(m) {
  const st = m.st; const q = st.q ? D.casters.find(x => x.k === st.q) : null; const mx = maxSpellLvl(q);

function doCast(q, sp, slot, ev) {

}
